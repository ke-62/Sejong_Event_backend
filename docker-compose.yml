# 로컬/스테이징에서 앱 + MySQL 을 한 번에 기동.
#   docker compose up --build
# prod 프로필을 쓰되, 빈 DB 이므로 ddl-auto 는 update 로 override 한다.
services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: sejong_event
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpw}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DB_URL: jdbc:mysql://db:3306/sejong_event?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpw}
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-key-must-be-at-least-256-bits-long-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    ports:
      - "8080:8080"

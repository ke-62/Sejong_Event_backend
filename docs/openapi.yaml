openapi: 3.0.1
info:
  title: 세종대학교 학내 행사 통합 관리 플랫폼 API
  description: 행사 모드(번호표·QR 입장·추첨)와 축제 모드(부스 혼잡도 실시간 안내)를 제공합니다.
  version: v1.0.0
servers:
- url: http://localhost
  description: Generated server url
security:
- BearerAuth: []
tags:
- name: Events
  description: 행사 API
- name: Attendance
  description: 입장 관리 API
- name: Waiting
  description: 웨이팅 API
- name: Booths
  description: 부스 API
- name: Festival
  description: 축제 설정 API
- name: Accounts
  description: 계정 관리 API (superuser 전용)
- name: Auth
  description: 인증 API
paths:
  /api/events/{eventId}:
    get:
      tags:
      - Events
      summary: 행사 단건 조회
      operationId: getEvent
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEventResponse"
    put:
      tags:
      - Events
      summary: 행사 수정
      operationId: updateEvent
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEventResponse"
    delete:
      tags:
      - Events
      summary: 행사 삭제
      operationId: deleteEvent
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/booths/{boothId}:
    get:
      tags:
      - Booths
      summary: 부스 상세 조회 (인증 불필요)
      operationId: getBooth
      parameters:
      - name: boothId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseBoothResponse"
    put:
      tags:
      - Booths
      summary: 부스 수정
      operationId: updateBooth
      parameters:
      - name: boothId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoothRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseBoothResponse"
    delete:
      tags:
      - Booths
      summary: 부스 삭제
      operationId: deleteBooth
      parameters:
      - name: boothId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/events:
    get:
      tags:
      - Events
      summary: 행사 목록 조회 (인증 선택)
      operationId: getEvents
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListEventResponse"
    post:
      tags:
      - Events
      summary: 행사 생성 (organizer 이상)
      operationId: createEvent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseEventResponse"
  /api/events/{eventId}/lottery:
    post:
      tags:
      - Attendance
      summary: 추첨 실행 (organizer 이상)
      operationId: lottery
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLotteryResponse"
  /api/events/{eventId}/attendance/scan:
    post:
      tags:
      - Attendance
      summary: QR 스캔 입장 처리 (인증 불필요)
      operationId: scan
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseScanResponse"
  /api/events/{eventId}/attendance/manual:
    post:
      tags:
      - Attendance
      summary: 수동 번호표 발급 (organizer 이상)
      operationId: manualIssue
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualTicketRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseManualTicketResponse"
  /api/booths:
    get:
      tags:
      - Booths
      summary: "부스 목록 조회 (인증 불필요), status=all 이면 전체 반환"
      operationId: getBooths
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListBoothResponse"
    post:
      tags:
      - Booths
      summary: 부스 신청 (organizer 이상)
      operationId: createBooth
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoothRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseBoothResponse"
  /api/booths/{boothId}/waiting:
    get:
      tags:
      - Waiting
      summary: 웨이팅 목록 조회 (organizer 이상)
      operationId: getWaitingList
      parameters:
      - name: boothId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListWaitingEntryResponse"
    post:
      tags:
      - Waiting
      summary: 웨이팅 등록 (인증 불필요)
      operationId: register
      parameters:
      - name: boothId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaitingRegisterRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWaitingRegisterResponse"
  /api/booths/{boothId}/waiting/next:
    post:
      tags:
      - Waiting
      summary: 다음 팀 호출 (organizer 이상)
      operationId: callNext
      parameters:
      - name: boothId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseNextWaitingResponse"
  /api/auth/logout:
    post:
      tags:
      - Auth
      summary: 로그아웃
      operationId: logout
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/auth/login:
    post:
      tags:
      - Auth
      summary: 로그인
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseLoginResponse"
  /api/accounts:
    get:
      tags:
      - Accounts
      summary: 운영진 계정 목록 조회
      operationId: getAccounts
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListAccountResponse"
    post:
      tags:
      - Accounts
      summary: 운영진 계정 생성
      operationId: createAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAccountResponse"
  /api/festival/status:
    get:
      tags:
      - Festival
      summary: 축제 활성 여부 조회
      operationId: getStatus
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseFestivalStatusResponse"
    patch:
      tags:
      - Festival
      summary: 축제 기능 ON/OFF (superuser)
      operationId: updateStatus
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFestivalStatusRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseFestivalStatusResponse"
  /api/booths/{boothId}/status:
    patch:
      tags:
      - Booths
      summary: 영업 상태 변경 (organizer 이상)
      operationId: updateStatus_1
      parameters:
      - name: boothId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoothStatusRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
  /api/booths/{boothId}/reject:
    patch:
      tags:
      - Booths
      summary: 부스 신청 거부 (superuser)
      operationId: rejectBooth
      parameters:
      - name: boothId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
  /api/booths/{boothId}/approve:
    patch:
      tags:
      - Booths
      summary: 부스 신청 승인 (superuser)
      operationId: approveBooth
      parameters:
      - name: boothId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseMapStringObject"
  /api/events/{eventId}/qr-token:
    get:
      tags:
      - Attendance
      summary: 운영진 QR 토큰 발급 (organizer 이상)
      operationId: getQrToken
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseQrTokenResponse"
  /api/events/{eventId}/attendance:
    get:
      tags:
      - Attendance
      summary: 입장 로그 조회 (organizer 이상)
      operationId: getAttendanceLogs
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseAttendanceListResponse"
  /api/booths/{boothId}/waiting/{waitingId}:
    get:
      tags:
      - Waiting
      summary: 내 웨이팅 상태 조회 (인증 불필요)
      operationId: getStatus_1
      parameters:
      - name: boothId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: waitingId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseWaitingStatusResponse"
    delete:
      tags:
      - Waiting
      summary: 웨이팅 취소 (organizer 이상)
      operationId: cancel
      parameters:
      - name: boothId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: waitingId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
  /api/booths/{boothId}/waiting/queue:
    get:
      tags:
      - Waiting
      summary: 웨이팅 대기열 공개 조회 — 이름·순번만 반환 (인증 불필요)
      operationId: getQueue
      parameters:
      - name: boothId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListWaitingQueueItem"
  /api/booths/mine:
    get:
      tags:
      - Booths
      summary: 내 기관 부스 전체 조회 — PENDING 포함 (organizer 이상)
      operationId: getMyBooths
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseListBoothResponse"
  /api/accounts/{accountId}:
    delete:
      tags:
      - Accounts
      summary: 운영진 계정 삭제
      operationId: deleteAccount
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
components:
  schemas:
    UpdateEventRequest:
      type: object
      properties:
        name:
          type: string
        organization:
          type: string
        location:
          type: string
        startAt:
          type: string
          format: date-time
        targetCount:
          type: integer
          format: int32
    ApiResponseEventResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/EventResponse"
    EventResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        organization:
          type: string
        location:
          type: string
        startAt:
          type: string
          format: date-time
        attendanceCount:
          type: integer
          format: int32
        targetCount:
          type: integer
          format: int32
        isActive:
          type: boolean
    UpdateBoothRequest:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        location:
          type: string
        emoji:
          type: string
        description:
          type: string
        organization:
          type: string
    ApiResponseBoothResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/BoothResponse"
    BoothResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          type: string
        location:
          type: string
        emoji:
          type: string
        gradient:
          type: string
        waiting:
          type: integer
          format: int32
        organization:
          type: string
        description:
          type: string
        status:
          type: string
        isOpen:
          type: boolean
        avgMinutes:
          type: number
          format: double
    CreateEventRequest:
      required:
      - location
      - name
      - targetCount
      type: object
      properties:
        name:
          type: string
        location:
          type: string
        startAt:
          type: string
          format: date-time
        targetCount:
          minimum: 1
          type: integer
          format: int32
        description:
          type: string
    ApiResponseLotteryResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/LotteryResponse"
    LotteryResponse:
      type: object
      properties:
        ticketNumber:
          type: integer
          format: int32
        studentId:
          type: string
        name:
          type: string
        department:
          type: string
    ScanRequest:
      required:
      - name
      - qrValue
      - studentId
      type: object
      properties:
        studentId:
          type: string
        name:
          type: string
        department:
          type: string
        qrValue:
          type: string
    ApiResponseScanResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/ScanResponse"
    ScanResponse:
      type: object
      properties:
        status:
          type: string
        ticketNumber:
          type: integer
          format: int32
        studentId:
          type: string
        name:
          type: string
        attendanceCount:
          type: integer
          format: int32
    ManualTicketRequest:
      required:
      - name
      - studentId
      type: object
      properties:
        studentId:
          type: string
        name:
          type: string
        department:
          type: string
    ApiResponseManualTicketResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/ManualTicketResponse"
    ManualTicketResponse:
      type: object
      properties:
        ticketNumber:
          type: integer
          format: int32
        studentId:
          type: string
        name:
          type: string
    CreateBoothRequest:
      required:
      - category
      - location
      - name
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        location:
          type: string
        emoji:
          type: string
        description:
          type: string
    WaitingRegisterRequest:
      required:
      - name
      - partySize
      - phone
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        partySize:
          minimum: 1
          type: integer
          format: int32
    ApiResponseWaitingRegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/WaitingRegisterResponse"
    WaitingRegisterResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        order:
          type: integer
          format: int32
        name:
          type: string
        partySize:
          type: integer
          format: int32
        status:
          type: string
        waitingAhead:
          type: integer
          format: int32
        estimatedMinutes:
          type: number
          format: double
    ApiResponseNextWaitingResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/NextWaitingResponse"
    NextWaitingResponse:
      type: object
      properties:
        calledId:
          type: integer
          format: int64
        remainingCount:
          type: integer
          format: int32
    ApiResponseVoid:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
    LoginRequest:
      required:
      - password
      - username
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    ApiResponseLoginResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/LoginResponse"
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserDto"
    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
        organization:
          type: string
        role:
          type: string
    CreateAccountRequest:
      required:
      - name
      - organization
      - password
      - username
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        name:
          type: string
        organization:
          type: string
    AccountResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        password:
          type: string
        name:
          type: string
        organization:
          type: string
        role:
          type: string
        isActive:
          type: boolean
    ApiResponseAccountResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/AccountResponse"
    UpdateFestivalStatusRequest:
      required:
      - isActive
      type: object
      properties:
        isActive:
          type: boolean
    ApiResponseFestivalStatusResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: "#/components/schemas/FestivalStatusResponse"
    FestivalStatusResponse:
      type: object
      properties:
        isActive:
          type: boolean
    UpdateBoothStatusRequest:
      required:
      - isOpen
      type: object
      properties:
        isOpen:
          type: boolean
    ApiResponseMapStringObject:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          additionalProperties:
            type: object
    ApiResponseListEventResponse:
      type: object
      properties:
        success:

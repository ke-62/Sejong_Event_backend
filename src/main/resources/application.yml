spring:
  application:
    name: sejong-event-platform
  profiles:
    # SPRING_PROFILES_ACTIVE 로 override (prod 배포 시 prod)
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sejong_event?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

jwt:
  # 로컬 개발용 기본값. prod 프로필에서는 JWT_SECRET 환경변수 필수.
  secret: ${JWT_SECRET:sejong-event-platform-jwt-secret-key-must-be-at-least-256-bits-long-for-security}
  access-token-expiration: 1800000    # 30분
  refresh-token-expiration: 604800000  # 7일

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

server:
  port: ${SERVER_PORT:8080}

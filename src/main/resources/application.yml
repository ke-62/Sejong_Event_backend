spring:
  application:
    name: sejong-event-platform
  profiles:
    # SPRING_PROFILES_ACTIVE 로 override (prod 배포 시 prod)
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sejong_event?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cache:
    # 기본 caffeine. SPRING_CACHE_TYPE=none 이면 캐시 없이 동작 (전후 성능 비교용)
    type: ${SPRING_CACHE_TYPE:caffeine}
    cache-names: festivalStatus,events,eventList
    caffeine:
      # 최대 항목 수 + 쓰기 후 만료(무효화 누락 시 최악의 경우 상한) + 적중률 통계
      spec: maximumSize=500,expireAfterWrite=10m,recordStats
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

jwt:
  # 로컬 개발용 기본값. prod 프로필에서는 JWT_SECRET 환경변수 필수.
  secret: ${JWT_SECRET:sejong-event-platform-jwt-secret-key-must-be-at-least-256-bits-long-for-security}
  access-token-expiration: 86400000   # 24시간
  refresh-token-expiration: 604800000  # 7일

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

server:
  port: ${SERVER_PORT:8080}

# Actuator — 로컬은 health·metrics 노출 (캐시 적중률: /actuator/metrics/cache.gets)
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
